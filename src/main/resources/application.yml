server:
  port: 8000

spring:
  application:
    name: gateway-api
  cloud:
    gateway:

      routes:
        - id: inventory-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/products, /api/products/**
            
        - id: orders-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders, /api/orders/**
